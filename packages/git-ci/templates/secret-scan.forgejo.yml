# CIG git-ci fallback — default onboarding check (1 of 3): secret scan.
#
# Runs on ci.cig.technology as a GitHub-independent fallback for whatever
# secret-scan check your GitHub Actions pipeline normally runs. Relays its
# result back to this repo's own GitHub Checks API so branch protection is
# satisfied even during a GitHub Actions platform outage.
#
# See docs/git-ci-outage-runbook.md in CIG-TECHNOLOGY/ComputeIntelligenceGraph
# for the operating model. Add more checks beyond this default set freely —
# this file is yours to extend once onboarded.

name: git-ci / secret-scan

on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: docker
    container:
      image: zricethezav/gitleaks:latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        id: scan
        continue-on-error: true
        run: gitleaks detect --source . --no-git -v

      - name: Relay result to GitHub
        if: always()
        env:
          FORGEJO_RELAY_TOKEN: ${{ secrets.FORGEJO_RELAY_TOKEN }}
        run: |
          CONCLUSION="success"
          if [ "${{ steps.scan.outcome }}" != "success" ]; then CONCLUSION="failure"; fi
          node .forgejo/scripts/relay-check-to-github.mjs \
            --owner "__GITHUB_OWNER__" \
            --repo "__GITHUB_REPO__" \
            --check-name "git-ci / secret-scan" \
            --conclusion "$CONCLUSION" \
            --sha "${{ github.sha }}" \
            --details-url "${{ github.server_url }}/${{ github.repository }}/actions"
