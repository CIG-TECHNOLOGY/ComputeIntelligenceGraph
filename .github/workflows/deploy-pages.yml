name: Deploy Landing + Docs → GitHub Pages

on:
  push:
    branches: [ main ]
    tags: [ "v*.*.*" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Detect if relevant paths changed on main branch pushes
  changes:
    name: Detect changes (branch pushes)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      landing: ${{ steps.filter.outputs.landing }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Paths filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            landing:
              - 'apps/landing/**'
              - 'packages/auth/**'
              - 'packages/ui/**'
              - 'release-metadata.json'
              - '.github/workflows/deploy-pages.yml'
            docs:
              - 'apps/docs/**'
              - '.github/workflows/deploy-pages.yml'

  # Build on a release tag, a manually requested run, or when relevant branch files changed.
  # Tags are required because releases can be cut from a branch other than main.
  build-pages:
    name: Build Pages Artifact
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref_type == 'tag') ||
      (github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.result == 'success' &&
      (needs.changes.outputs.landing == 'true' || needs.changes.outputs.docs == 'true')))
    runs-on: ubuntu-latest
    needs: [changes]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build landing page
        run: pnpm --filter @cig/landing build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SITE_URL: https://cig.lat
          NEXT_PUBLIC_API_URL: https://api.cig.technology
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_DASHBOARD_URL: ${{ secrets.NEXT_PUBLIC_DASHBOARD_URL }}
          NEXT_PUBLIC_AUTHENTIK_URL: ${{ vars.NEXT_PUBLIC_AUTHENTIK_URL || 'https://auth.cig.technology' }}
          NEXT_PUBLIC_AUTHENTIK_CLIENT_ID: ${{ vars.NEXT_PUBLIC_AUTHENTIK_CLIENT_ID || 'cig-dashboard' }}

      - name: Build Docusaurus docs
        run: pnpm --filter @cig/docs build
        env:
          NODE_ENV: production

      - name: Merge docs into landing at /documentation
        run: |
          mkdir -p ./apps/landing/out/documentation
          cp -r ./apps/docs/build/. ./apps/landing/out/documentation/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: ./apps/landing/out

  # Deploy after the artifact is available to the Pages service.
  deploy-pages:
    name: Deploy Pages
    if: ${{ always() && needs.build-pages.result == 'success' }}
    runs-on: ubuntu-latest
    needs: [build-pages]
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages

      - name: Verify deployed runtime version
        env:
          EXPECTED_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          [[ -n "$PAGE_URL" ]]
          marker_url="${PAGE_URL%/}/runtime-version.json"
          curl --fail --show-error --silent --retry 12 --retry-delay 5 "$marker_url" | tee runtime-version.json
          if [[ -n "$EXPECTED_TAG" ]]; then
            expected_version="${EXPECTED_TAG#v}"
            expected_version="${expected_version%%+build.*}"
            jq -e --arg version "$expected_version" --arg tag "$EXPECTED_TAG" \
              '(.version == $version) and (.releaseTag == $tag)' runtime-version.json >/dev/null
          fi
