name: Deploy Dashboard -> AWS ECS

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing ECR image tag to deploy (leave blank to build from source)"
        required: false
        default: ""
      dry_run:
        description: "Build and push only; skip the ECS rollout"
        type: boolean
        default: false

concurrency:
  group: deploy-dashboard-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-2
  AWS_ROLE_TO_ASSUME: arn:aws:iam::520900722378:role/github-actions-role
  ECR_REGISTRY: 520900722378.dkr.ecr.us-east-2.amazonaws.com
  ECR_REPOSITORY: cig-dashboard-production
  ECS_CLUSTER: cig-api-production-cluster
  ECS_SERVICE: cig-dashboard-production-service
  ECS_TASK_FAMILY: cig-dashboard-production
  ECS_CONTAINER_NAME: dashboard
  DASHBOARD_URL: https://app.cig.lat

jobs:
  resolve-tag:
    name: Resolve image tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - name: Determine tag
        id: tag
        shell: bash
        run: |
          if [[ -n "${{ github.event.inputs.image_tag }}" ]]; then
            echo "value=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME#v}"
            echo "value=${TAG//+/-}" >> "$GITHUB_OUTPUT"
          else
            echo "value=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build and push dashboard image
    runs-on: ubuntu-latest
    needs: resolve-tag
    if: ${{ github.event.inputs.image_tag == '' || github.event.inputs.image_tag == null }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/infra/docker/Dockerfile.dashboard
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ needs.resolve-tag.outputs.tag }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.cig.technology
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://cig.technology' }}
            NEXT_PUBLIC_DASHBOARD_URL=${{ vars.NEXT_PUBLIC_DASHBOARD_URL || 'https://app.cig.lat' }}
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_AUTHENTIK_URL=${{ vars.NEXT_PUBLIC_AUTHENTIK_URL || 'https://auth.cig.technology' }}
            NEXT_PUBLIC_AUTHENTIK_CLIENT_ID=${{ vars.NEXT_PUBLIC_AUTHENTIK_CLIENT_ID || 'cig-dashboard' }}
            NEXT_PUBLIC_APP_VERSION=${{ needs.resolve-tag.outputs.tag }}
            NEXT_PUBLIC_RELEASE_TAG=${{ needs.resolve-tag.outputs.tag }}
            NEXT_PUBLIC_APP_BUILD=${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy:
    name: Roll out dashboard to ECS
    runs-on: ubuntu-latest
    needs: [resolve-tag, build]
    if: |
      always() &&
      needs.resolve-tag.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      github.event.inputs.dry_run != 'true'
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: https://app.cig.lat
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}

      - name: Register task definition and update service
        id: deploy
        shell: bash
        env:
          IMAGE_URI: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ needs.resolve-tag.outputs.tag }}
        run: |
          set -euo pipefail
          aws ecs describe-task-definition \
            --region "$AWS_REGION" \
            --task-definition "$ECS_TASK_FAMILY" \
            --query taskDefinition > task-definition.json

          jq --arg image "$IMAGE_URI" --arg container "$ECS_CONTAINER_NAME" \
            'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)
             | .containerDefinitions |= map(if .name == $container then .image = $image else . end)' \
            task-definition.json > task-definition-register.json

          TASK_DEFINITION=$(aws ecs register-task-definition \
            --region "$AWS_REGION" \
            --cli-input-json file://task-definition-register.json \
            --query taskDefinition.taskDefinitionArn \
            --output text)

          aws ecs update-service \
            --region "$AWS_REGION" \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$TASK_DEFINITION" \
            --force-new-deployment >/dev/null

          echo "task_definition=$TASK_DEFINITION" >> "$GITHUB_OUTPUT"

      - name: Wait for ECS service stability
        run: |
          aws ecs wait services-stable \
            --region "$AWS_REGION" \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

      - name: Smoke test dashboard and release marker
        shell: bash
        run: |
          set -euo pipefail
          STATUS=$(curl -fsS -o /dev/null -w "%{http_code}" --max-time 20 "$DASHBOARD_URL")
          [[ "$STATUS" == "200" ]]
          curl -fsS --max-time 20 "$DASHBOARD_URL/runtime-version.json" | tee release-marker.json
          jq -e --arg expected "${{ needs.resolve-tag.outputs.tag }}" \
            '(.version == $expected) or (.releaseTag == $expected) or (.releaseTag == ("v" + $expected))' \
            release-marker.json >/dev/null
          echo "Dashboard $DASHBOARD_URL is serving release ${{ needs.resolve-tag.outputs.tag }}"
